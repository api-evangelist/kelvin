  /api/v3/simulations/{simulation_id}/projected-state/renovation-plans/{renovation_plan_id}:
    get:
      summary: Récupérer le plan de rénovation personnalisé
      tags:
      - Qualification
      description: Les informations du plan de rénovation personnalisé.
      security:
      - bearerAuth: []
      parameters:
      - name: simulation_id
        in: path
        required: true
        example: hjjcm1qp28
        description: L'identifiant de simulation renvoyé par l'appel au endpoint créer
        schema:
          type: string
      - name: renovation_plan_id
        in: path
        required: true
        example: hjjcm1qp28
        description: L'identifiant du plan de rénovation personnalisé.
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - pending
                    - processing
                    - completed
                    - failed
                    example: completed
                    description: Le statut de l'opération de génération de résultat.
                  id:
                    type: string
                    example: hjjcm1qp28
                    description: L'identifiant du plan de rénovation personnalisé.
                  name:
                    type: string
                    example: Mon plan personnalisé
                    description: Le nom du plan de rénovation personnalisé.
                  type:
                    type: string
                    enum:
                    - normal
                    - customized
                    - optimized
                    example: customized
                    description: Le type de plan de rénovation personnalisé.
                  overall_rating:
                    type: string
                    enum:
                    - A
                    - B
                    - C
                    - D
                    - E
                    - F
                    - G
                    example: B
                    description: La lettre DPE globale (la plus défavorable entre énergie et GES).
                  energy_rating:
                    type: string
                    enum:
                    - A
                    - B
                    - C
                    - D
                    - E
                    - F
                    - G
                    example: B
                    description: La lettre énergie après rénovation.
                  energy_consumption:
                    type: integer
                    example: 201
                    description: La consommation énergétique après rénovation en kWh/m²/an.
                  carbon_rating:
                    type: string
                    enum:
                    - A
                    - B
                    - C
                    - D
                    - E
                    - F
                    - G
                    example: C
                    description: La lettre GES après rénovation.
                  carbon_emissions:
                    type: integer
                    example: 40
                    description: Les émissions de gaz à effet de serre après rénovation en kg CO2/m²/an.
                  yearly_energy_savings:
                    type: integer
                    description: Économies d'énergie annuelles estimées en Euros.
                    example: 600
                  yearly_energy_cost:
                    type: integer
                    description: Coût énergétique annuel estimé en Euros.
                    example: 12000
                  budget:
                    type: number
                    format: float
                    example: 400
                    description: Le budget total du plan de rénovation personnalisé.
                  financial_support:
                    $ref: '#/components/schemas/FinancialSupport'
