  /api/v3/simulations/{simulation_id}/report:
    post:
      summary: Lancer la génération du rapport PDF
      description: Endpoint pour démarrer la génération asynchrone du rapport PDF de la simulation. Le rapport peut optionnellement inclure les informations du client.
      tags:
      - Qualification
      security:
      - bearerAuth: []
      parameters:
      - name: simulation_id
        in: path
        required: true
        example: hjjcm1qp28
        description: L'identifiant de simulation renvoyé par l'appel au endpoint créer
        schema:
          type: string
      responses:
        '204':
          description: No Content - La génération du rapport a été lancée avec succès.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Forbidden
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Could not find the simulation
        '409':
          description: Conflict - La simulation n'est pas encore terminée.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: The simulation has not been run yet
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client:
                  type: object
                  description: Les informations du client (nom, prénom, email, téléphone)
                  properties:
                    first_name:
                      type: string
                      example: Jean
                      description: Le prénom du client
                    last_name:
                      type: string
                      example: Dupont
                      description: Le nom de famille du client
                    email:
                      type: string
                      example: jean.dupont@example.com
                      description: L'email du client
                    phone_number:
                      type: string
                      example: '+33600112233'
                      description: Le téléphone du client
    get:
      summary: Récupérer le statut du rapport PDF
      description: Le statut de la génération du rapport PDF et l'URL de téléchargement.
      tags:
      - Qualification
      security:
      - bearerAuth: []
      parameters:
      - name: simulation_id
        in: path
        required: true
        example: hjjcm1qp28
        description: L'identifiant de simulation renvoyé par l'appel au endpoint créer
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - pending
                    - processing
                    - completed
                    - failed
                    example: completed
                    description: Le statut de la génération du rapport.
                  download_url:
                    type: string
                    example: https://app.go-kelvin.com/rails/active_storage/blobs/redirect/xxx/report.pdf
                    description: L'URL de téléchargement du rapport PDF. Présent uniquement lorsque le statut est 'completed'.
                required:
                - status
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Forbidden
        '404':
          description: Not Found - Aucune génération de rapport n'a été demandée.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: No report generation has been requested
        '409':
          description: Conflict - La simulation n'est pas encore terminée.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: The simulation has not been run yet
    servers:
    - url: '{protocol}://{defaultHost}'
      variables:
        protocol:
          default: https
        defaultHost:
          default: app.go-kelvin.com
  /api/v2/dpes:
    get:
      summary: Rechercher des DPE par clé d'interopérabilité ou par numéro DPE.
      tags:
      - Qualification
      description: 'Cet endpoint permet de rechercher des DPE par clé d''interopérabilité ou par numéro de DPE.


        **Fonctionnalités :** Il est obligatoire de fournir au moins un des deux paramètres "ban_id" ou "dpe_id".

        - **Recherche par clé d''interopérabilité** : Il est possible de rechercher les DPE par la clé d''interopérabilité (ban_id) d''une adresse. Par exemple "31157_0790_00009".

        - **Recherche par Numéro de DPE** : Il est également possible de rechercher un DPE en utilisant son numéro unique. Cela permet de récupérer rapidement les informations d''un DPE spécifique, par exemple "2331E2555868X".


        **Filtres :**

        En plus des paramètres principaux, cet endpoint permet d''appliquer des filtres supplémentaires :

        - **Surface** : Filtrer les DPE en fonction de la surface du bien à 10% près.

        - **Date du du diagnostic** : Filtrer les DPE selon la date à laquelle ils ont été établis.

        - **Classe Énergétique** : Filtrer par la classe énergétique du DPE.


        **Réponse :**

        En cas de succès, l''endpoint retourne une liste de DPE correspondant aux critères de recherche spécifiés.'
      security:
      - bearerAuth: []
      parameters:
      - name: dpe_id
        in: query
        required: false
        example: 2331E2555868X
        schema:
          type: string
      - name: building_type
        in: query
        required: false
        example: house
        enum:
        - apartment
        - house
        - building
        - unknown
        description: "Le type de bâtiment:\n * `apartment` \n * `house` \n * `building` \n * `unknown` \n "
        schema:
          type: string
      - name: ban_id
        in: query
        required: false
        example: '31157_0790_00009'
        schema:
          type: string
      - name: surface
        in: query
        required: false
        example: 100
        schema:
          type: number
      - name: report_date
        in: query
        required: false
        example: '2024-01-01'
        schema:
          type: string
      - name: energy_class
        in: query
        required: false
        example: E
        schema:
          type: string
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    dpe_id:
                      type: string
                      example: 2331E2555868X
                      description: Le numéro unique du DPE.
                    building_type:
                      type: string
                      example: house
                      enum:
                      - apartment
                      - house
                      - building
                      - unknown
                      description: Le type de bâtiment.
                    ban_id:
                      type: string
                      example: '31157_0790_00009'
                      description: clé d'interopérabilité.
                    energy_class:
                      type: string
                      example: A
                      description: La classe énergétique du DPE.
                    emission_class:
                      type: string
                      example: B
                      description: La classe d'émission du DPE.
                    surface:
                      type: number
                      example: 100
                      description: La surface.
                    report_date:
                      type: string
                      example: '2024-05-10'
                      description: La date à laquelle le DPE a été établi.
                    address:
                      type: string
                      example: 9 Rue du Vivier, Cugnaux, 31270
                      description: L'adresse associée au DPE
                    address_complement:
                      type: string
                      example: 'Escalier: Etage 3; Porte 322, Lot: 10'
                      description: Détails supplémentaires pour l'adresse.
                    dpe_version:
                      type: string
                      example: '2.4'
                      description: La version du dpe.
                  required:
                  - dpe_id
                  - ban_id
                  - energy_class
                  - emission_class
                  - surface
                  - report_date
                  - address
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Required dpe_id and ban_id are both missing
                    description: Error message indicating the issue.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Forbidden
    servers:
    - url: '{protocol}://{defaultHost}'
      variables:
        protocol:
          default: https
        defaultHost:
          default: app.go-kelvin.com
