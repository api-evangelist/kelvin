    patch:
      summary: Modifier un plan de rénovation personnalisé
      tags:
      - Qualification
      description: 'Modifie un plan de rénovation existant en mode avancé (choix de la prestation et de la référence catalogue). Un nouveau plan est créé à partir de l''original afin de conserver l''historique. L''opération est asynchrone : consultez le plan via le endpoint ''Récupérer le plan de rénovation personnalisé'' une fois le traitement terminé.'
      security:
      - bearerAuth: []
      parameters:
      - name: simulation_id
        in: path
        required: true
        example: hjjcm1qp28
        description: L'identifiant de simulation renvoyé par l'appel au endpoint créer
        schema:
          type: string
      - name: renovation_plan_id
        in: path
        required: true
        example: hjjcm1qp28
        description: L'identifiant du plan de rénovation personnalisé à modifier.
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  renovation_plan_id:
                    type: string
                    example: hjjcm1qp28
                    description: L'identifiant du nouveau plan de rénovation personnalisé.
                required:
                - renovation_plan_id
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Error message indicating the issue.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Forbidden
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Could not find the simulation
                    description: Error message indicating the issue.
