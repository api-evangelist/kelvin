                    type: string
                    example: op1a2b3c4d
                    description: L'identifiant de la génération, à passer au endpoint de statut.
                  document_type:
                    type: string
                    example: report
                    description: Le type de document généré.
                required:
                - operation_id
                - document_type
        '401':
          description: Unauthorized
          content:
