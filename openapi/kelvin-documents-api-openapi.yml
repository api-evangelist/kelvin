  /api/v3/simulations/{simulation_id}/documents/commercial-offer:
    post:
      summary: 'Lancer la génération du document : Offre commerciale'
      description: Crée un devis à partir d'un plan de rénovation, puis lance la génération asynchrone du PDF « Offre commerciale ». Renvoie l'identifiant de la génération à utiliser pour interroger son statut, ainsi que l'identifiant du devis créé. Répond 403 si les devis sont désactivés pour l'équipe, et 422 si le plan de rénovation est inconnu.
      tags:
      - Documents
      security:
      - bearerAuth: []
      parameters:
      - name: simulation_id
        in: path
        required: true
        example: hjjcm1qp28
        description: L'identifiant de simulation renvoyé par l'appel au endpoint créer
        schema:
          type: string
      responses:
        '202':
          description: Accepted - Le devis a été créé et la génération du document a été lancée.
          content:
            application/json:
              schema:
                type: object
                properties:
                  operation_id:
                    type: string
                    example: op1a2b3c4d
                    description: L'identifiant de la génération, à passer au endpoint de statut.
                  document_type:
                    type: string
                    example: commercial_offer
                    description: Le type de document généré.
                  quotation_id:
                    type: string
                    example: quo1a2b3c4d
                    description: L'identifiant du devis créé à partir du plan de rénovation.
                required:
                - operation_id
                - document_type
                - quotation_id
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: unauthorized
        '403':
          description: Forbidden - Scope manquant ou devis désactivés pour l'équipe.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: missing_scope
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Could not find the simulation
        '409':
          description: Conflict - La simulation n'est pas encore terminée.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: The simulation has not been run yet
        '422':
          description: Unprocessable Content - Plan de rénovation inconnu.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unknown renovation plan
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                renovation_plan_id:
                  type: string
                  example: rp1a2b3c4d
                  description: Identifiant du plan de rénovation (sqid du scénario) à partir duquel créer le devis.
              required:
              - renovation_plan_id
        required: true
      operationId: postApiV3SimulationsBySimulationIdDocumentsCommercialOffer
      x-operation-id-source: derived
  /api/v3/simulations/{simulation_id}/documents/{id}:
    get:
      summary: Récupérer le statut d'une génération de document
      description: Récupère le statut de la génération d'un document et l'URL de téléchargement lorsqu'il est prêt.
      tags:
      - Documents
      security:
      - bearerAuth: []
      parameters:
      - name: simulation_id
        in: path
        required: true
        example: hjjcm1qp28
        description: L'identifiant de simulation renvoyé par l'appel au endpoint créer
        schema:
          type: string
      - name: id
        in: path
        required: true
        example: op1a2b3c4d
        description: L'identifiant de génération renvoyé par le endpoint de lancement
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - pending
                    - processing
                    - completed
                    - failed
                    example: completed
                  document_type:
                    type: string
                    example: report
                  download_url:
                    type: string
                    example: https://app.go-kelvin.com/rails/active_storage/blobs/redirect/xxx/report.pdf
                    description: Présent uniquement lorsque le statut est 'completed'.
                required:
                - status
                - document_type
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: unauthorized
        '404':
          description: Not Found - Aucune génération de document ne correspond.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Could not find the document generation
      operationId: getApiV3SimulationsBySimulationIdDocumentsById
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Le token commence par 'team-api-key-'
