openapi: 3.2.0
info:
  title: kelvin Documents API
  version: v3
  description: Bienvenue dans la documentation de l'API kelvin.
servers:
- url: '{protocol}://{defaultHost}'
  variables:
    protocol:
      default: https
    defaultHost:
      default: app.go-kelvin.com
security:
- bearerAuth: []
tags:
- name: Documents
  description: Endpoints pour consulter les documents générés pour une simulation
paths:
  /api/v3/simulations/{simulation_id}/documents:
    get:
      summary: Lister les documents de la simulation
      description: Liste paginée des documents générés pour la simulation (rapports PDF, offres commerciales, cadres de contribution, notes de dimensionnement, attestations sur l'honneur). Par défaut, seul le dernier document est renvoyé. Utilisez `full=true` pour tous les documents, `id` pour un document précis, `type` pour filtrer par type de document, et `begin`/`end` pour filtrer par date de génération.
      tags:
      - Documents
      security:
      - bearerAuth: []
      parameters:
      - name: simulation_id
        in: path
        required: true
        example: hjjcm1qp28
        description: L'identifiant de simulation renvoyé par l'appel au endpoint créer
        schema:
          type: string
      - name: full
        in: query
        required: false
        description: Renvoie tous les documents au lieu du seul dernier document.
        schema:
          type: boolean
      - name: id
        in: query
        required: false
        description: Renvoie uniquement le document correspondant à cet identifiant.
        schema:
          type: integer
      - name: type
        in: query
        required: false
        enum:
        - report
        - commercial_offer
        - contribution_framework
        - dimensioning_note
        - sworn_statement
        description: "Ne renvoie que les documents du type donné.:\n * `report` \n * `commercial_offer` \n * `contribution_framework` \n * `dimensioning_note` \n * `sworn_statement` \n "
        schema:
          type: string
      - name: begin
        in: query
        format: date-time
        required: false
        description: Ne renvoie que les documents générés à partir de cette date (ISO 8601).
        schema:
          type: string
      - name: end
        in: query
        format: date-time
        required: false
        description: Ne renvoie que les documents générés jusqu'à cette date (ISO 8601).
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Numéro de page.
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        default: 1000
        description: Nombre de documents par page (par défaut 1000).
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Le numéro unique du document.
                          example: 42
                        team_id:
                          type: string
                          description: L'identifiant de l'équipe.
                          example: 4732fnd4mt
                        user_id:
                          type: string
                          nullable: true
                          description: L'identifiant de l'utilisateur associé à la simulation.
                          example: 9ab3cd2ef1
                        simulation_id:
                          type: string
                          description: L'identifiant de la simulation mère (racine).
                          example: hjjcm1qp28
                        source_simulation_id:
                          type: string
                          description: L'identifiant de la simulation (enfant ou racine) à laquelle le document est directement rattaché.
                          example: 3kd8fvn2mt
                        generated_at:
                          type: string
                          format: date-time
                          description: L'horodatage de la génération du document.
                          example: '2026-07-03T14:00:00Z'
                        type:
                          type: string
                          description: Le type de document.
                          enum:
                          - report
                          - commercial_offer
                          - contribution_framework
                          - dimensioning_note
                          - sworn_statement
                          example: report
                        metadata:
                          type: object
                          description: Métadonnées du document générées au moment de la création.
                          properties:
                            format:
                              type: string
                              description: Format du fichier généré.
                              example: pdf
                            scenario_ids:
                              type: array
                              description: Identifiants des scénarios inclus dans le document.
                              items:
                                type: string
                              example:
                              - hjjcm1qp28
                            type:
                              type: string
                              description: Type de document généré.
                              example: report
                            report_template:
                              type: string
                              nullable: true
                              description: 'Template sélectionné lors de la génération. Valeurs possibles : `current_state` (Etat actuel du logement), `full` (Rapport complet). `null` pour les générations sans sélection de template (ex: API).'
                              enum:
                              - current_state
                              - full
                              example: current_state
                        download_url:
                          type: string
                          description: L'URL de téléchargement du document.
                          example: https://app.go-kelvin.com/rails/active_storage/blobs/redirect/xxx/report.pdf
                  meta:
                    type: object
                    properties:
                      total_pages:
                        type: integer
                        example: 1
                      current_page:
                        type: integer
                        example: 1
                      total_count:
                        type: integer
                        example: 1
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Forbidden
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Could not find the simulation
      operationId: getApiV3SimulationsBySimulationIdDocuments
      x-operation-id-source: derived
  /api/v3/simulations/{simulation_id}/documents/report:
    post:
      summary: 'Lancer la génération du document : Rapport complet'
      description: Lance la génération asynchrone du document PDF « Rapport complet » pour la simulation. Renvoie l'identifiant de la génération à utiliser pour interroger son statut. Répond 403 si le document dépend d'une configuration d'équipe désactivée, et 422 si les données de la simulation ne permettent pas de produire le document.
      tags:
      - Documents
      security:
      - bearerAuth: []
      parameters:
      - name: simulation_id
        in: path
        required: true
        example: hjjcm1qp28
        description: L'identifiant de simulation renvoyé par l'appel au endpoint créer
        schema:
          type: string
      responses:
        '202':
          description: Accepted - La génération du document a été lancée.
          content:
            application/json:
              schema:
                type: object
                properties:
                  operation_id:
                    type: string
                    example: op1a2b3c4d
                    description: L'identifiant de la génération, à passer au endpoint de statut.
                  document_type:
                    type: string
                    example: report
                    description: Le type de document généré.
                required:
                - operation_id
                - document_type
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: unauthorized
        '403':
          description: Forbidden - Scope manquant ou document désactivé pour l'équipe.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: missing_scope
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Could not find the simulation
        '409':
          description: Conflict - La simulation n'est pas encore terminée.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: The simulation has not been run yet
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                scenario_ids:
                  type: array
                  items:
                    type: string
                  description: 'Optionnel. Identifiants des plans de rénovation à inclure (par défaut : tous les plans éligibles). Utilisé uniquement pour les documents liés à un scénario.'
      operationId: postApiV3SimulationsBySimulationIdDocumentsReport
      x-operation-id-source: derived
