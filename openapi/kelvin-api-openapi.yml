      tags:
      - Simulateur
      description: 'Enregistre les informations de qualification du profil utilisateur.


        **Comportement de `primary_residence` selon `profile` :**

        - `owner_resident` : `primary_residence` est automatiquement défini à `true` (la valeur fournie est ignorée).

        - `owner_non_resident` : `primary_residence` est automatiquement défini à `false` (la valeur fournie est ignorée).

        - `renter` ou `lessor` : `primary_residence` est **obligatoire** ; son absence retourne une erreur `400`.


        **Effet sur la simulation :**

        Après une mise à jour réussie, les résultats de simulation existants ne sont plus à jour.

        Appelez `POST /api/v3/simulations/{simulation_id}/run` pour obtenir des résultats recalculés.

        '
      security:
      - bearerAuth: []
      parameters:
      - name: simulation_id
        in: path
        required: true
        example: hjjcm1qp28
        description: L'identifiant de la simulation.
        schema:
          type: string
      responses:
        '204':
          description: Qualification enregistrée avec succès.
        '400':
          description: Bad Request - code département fiscal invalide
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Tax residence department is invalid
                    description: Le code département ne correspond à aucun département connu.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Forbidden
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Could not find the simulation
                    description: La simulation n'existe pas ou n'appartient pas à cette équipe.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                profile:
                  type: string
                  enum:
                  - owner_resident
                  - owner_non_resident
                  - renter
                  - lessor
                  example: owner_resident
                  description: 'Le profil de l''utilisateur. `owner_resident` : propriétaire occupant (primary_residence forcé
                    à true). `owner_non_resident` : propriétaire non-occupant (primary_residence forcé à false). `renter`
                    : locataire (primary_residence requis). `lessor` : bailleur (primary_residence requis).'
                primary_residence:
                  type: boolean
                  example: true
                  description: Indique si le logement est la résidence principale. Obligatoire pour les profils `renter` et
                    `lessor`. Ignoré (auto-calculé) pour les profils `owner_resident` et `owner_non_resident`.
                household_size:
                  type: integer
                  minimum: 1
                  maximum: 12
                  example: 4
                  description: Nombre de personnes dans le foyer fiscal.
                tax_residence_department:
                  type: string
                  example: '75'
                  description: 'Code du département de résidence fiscale (ex : "75", "13", "2A"). Doit correspondre à un code
                    de département français valide. Utilisé pour calculer les plafonds de revenus ANAH.'
                income_range:
                  type: string
                  enum:
                  - very_modest
                  - modest
                  - intermediate
                  - superior
                  example: modest
                  description: 'Tranche de revenus du foyer selon le barème ANAH. `very_modest` : très modeste. `modest` :
                    modeste. `intermediate` : intermédiaire. `superior` : supérieure aux plafonds ANAH.'
                project_maturity:
                  type: string
                  enum:
                  - curious
                  - searching
                  - estimated
                  - signed
                  example: curious
                  description: 'Maturité du projet de rénovation. `curious` : en phase de découverte. `searching` : en recherche
                    active. `estimated` : devis reçu. `signed` : devis signé.'
              required:
              - profile
              - household_size
              - income_range
        required: true
