    post:
      summary: Créer une simulation
      tags:
      - Simulateur
      description: Endpoint pour créer une simulation à partir d'un ban_id et des coordonnées GPS.
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  simulation_id:
                    type: string
                    example: hjjcm1qp28
                    description: L'identifiant de la simulation créée.
                required:
                - simulation_id
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Latitude is missing, Longitude is missing
                    description: Error message indicating the issue.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Forbidden
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Could not find an address for the given GPS coordinates
                    description: Error message indicating the issue.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                latitude:
                  type: number
                  example: 43.53718
                longitude:
                  type: number
                  example: 1.337797
                ban_id:
                  type: string
                  example: '31157_0790_00009'
              required:
              - latitude
              - longitude
  /api/v3/simulations/{simulation_id}/housing:
    get:
      summary: Récupérer les informations de la propriété
      tags:
      - Simulateur
      description: Les informations de la propriété.
      security:
      - bearerAuth: []
      parameters:
      - name: simulation_id
        in: path
        required: true
        example: hjjcm1qp28
        description: L'identifiant de simulation renvoyé par l'appel au endpoint créer
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - pending
                    - processing
                    - completed
                    - failed
                    example: completed
                    description: Le statut de l'opération de génération de résultat.
                  housing:
                    type: object
                    properties:
                      housing_type:
                        type:
                        - string
                        - 'null'
                        enum:
                        - house
                        - apartment
                        - unknown
                        example: apartment
                        description: Le type de la propriété.
                      epc_id:
                        type:
                        - string
                        - 'null'
                        example: 2331E2555868X
                        description: Le numéro unique du DPE.
                      surface:
                        type:
                        - integer
                        - 'null'
                        example: 100
                        description: La surface de la propriété en m2.
                      floor_level:
                        type:
                        - string
                        - 'null'
                        enum:
                        - ground
                        - intermediate
                        - last
                        example: ground
                        description: La position da le propriété dans l'immeuble.
                      number_of_exterior_wall:
                        type:
                        - integer
                        - 'null'
                        example: 1
                        description: Le nombre de murs donnant sur l'extérieur.
                  address:
                    type: object
                    properties:
                      street_number:
                        type: string
                        example: '123'
                        description: Le numéro de la rue.
                      address_line_1:
                        type: string
                        example: Rue de la Paix
                        description: Le nom de la rue.
                      address_line_2:
                        type:
                        - string
                        - 'null'
                        example: Apt 4B
                        description: Complément d'adresse.
                      city:
                        type: string
                        example: Paris
                        description: La ville.
                      postal_code:
                        type: string
                        example: '75000'
                        description: Le code postal.
                      country_number:
                        type: integer
                        example: 250
                        description: Le numéro du pays, code ISO3166. France = 250
                      latitude:
                        type: number
                        example: 43.53718
                        description: La latitude.
                      longitude:
                        type: number
                        example: 1.337797
                        description: La longitude.
                required:
                - housing
                - status
                - address
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Forbidden
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Could not find the simulation
                    description: Error message indicating the issue.
    put:
      summary: Mettre à jour les informations de la propriété
      tags:
      - Simulateur
      description: Endpoint pour mettre à jour les informations de la propriété
      security:
      - bearerAuth: []
      parameters:
      - name: simulation_id
        in: path
        required: true
        example: hjjcm1qp28
        description: L'identifiant de simulation renvoyé par l'appel au endpoint créer
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Housing type is missing or invalid
                    description: Error message indicating the issue.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Forbidden
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                epc_id:
                  type: string
                  example: 2331E2555868X
                  description: Le numéro unique du DPE.
                housing_type:
                  type: string
                  enum:
                  - house
                  - apartment
                  example: apartment
                  description: Le type de propriété.
                surface:
                  type: integer
                  example: 100
                  description: La surface de la propriété en m2. Obligatoire si le housing_type est apartment.
                floor_level:
                  type: string
                  enum:
                  - ground
                  - intermediate
                  - last
                  example: ground
                  description: La position da le propriété dans l'immeuble. Obligatoire si le housing_type est apartment.
                number_of_exterior_wall:
                  type: integer
                  example: 1
                  description: Le nombre de murs donnant sur l'extérieur. Obligatoire si le housing_type est apartment.
              required:
              - simulation_id
              - post_params
