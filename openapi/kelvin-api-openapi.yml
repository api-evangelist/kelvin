      summary: Modifier un plan de rénovation personnalisé
      tags:
      - Qualification
      description: 'Modifie un plan de rénovation existant en mode avancé (choix de la prestation et de la référence catalogue).
        Un nouveau plan est créé à partir de l''original afin de conserver l''historique. L''opération est asynchrone : consultez
        le plan via le endpoint ''Récupérer le plan de rénovation personnalisé'' une fois le traitement terminé.'
