  /api/v3/simulations/{simulation_id}/projected-state/renovation-plans:
    post:
      summary: Créer un plan de rénovation personnalisé
      tags:
      - Qualification
      description: 'Crée un plan de rénovation basé sur une sélection spécifique de gestes. L''opération est asynchrone :
        l''API retourne immédiatement une réponse confirmant la création, mais le plan complet n''est pas disponible dans
        l''instant. Pour consulter le plan généré une fois le traitement terminé, utilisez le endpoint ''Récupérer le plan
        de rénovation personnalisé''.'
      security:
      - bearerAuth: []
      parameters:
      - name: simulation_id
        in: path
        required: true
        example: hjjcm1qp28
        description: L'identifiant de simulation renvoyé par l'appel au endpoint créer
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  renovation_plan_id:
                    type: string
                    example: hjjcm1qp28
                    description: L'identifiant du plan de rénovation personnalisé.
                required:
                - renovation_plan_id
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Error message indicating the issue.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Forbidden
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Could not find the simulation
                    description: Error message indicating the issue.
