  /api/v3/simulations/{simulation_id}/report:
    post:
      summary: Lancer la génération du rapport PDF
      description: Endpoint pour démarrer la génération asynchrone du rapport PDF de la simulation. Le rapport peut optionnellement
        inclure les informations du client.
      tags:
      - Qualification
      security:
      - bearerAuth: []
      parameters:
      - name: simulation_id
        in: path
        required: true
        example: hjjcm1qp28
        description: L'identifiant de simulation renvoyé par l'appel au endpoint créer
        schema:
          type: string
      responses:
        '204':
          description: No Content - La génération du rapport a été lancée avec succès.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Forbidden
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Could not find the simulation
        '409':
          description: Conflict - La simulation n'est pas encore terminée.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: The simulation has not been run yet
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client:
                  type: object
                  description: Les informations du client (nom, prénom, email, téléphone)
                  properties:
                    first_name:
                      type: string
                      example: Jean
                      description: Le prénom du client
                    last_name:
                      type: string
                      example: Dupont
                      description: Le nom de famille du client
                    email:
                      type: string
                      example: jean.dupont@example.com
                      description: L'email du client
                    phone_number:
                      type: string
                      example: '+33600112233'
                      description: Le téléphone du client
    get:
      summary: Récupérer le statut du rapport PDF
      description: Le statut de la génération du rapport PDF et l'URL de téléchargement.
      tags:
      - Qualification
      security:
      - bearerAuth: []
      parameters:
      - name: simulation_id
        in: path
        required: true
        example: hjjcm1qp28
        description: L'identifiant de simulation renvoyé par l'appel au endpoint créer
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - pending
                    - processing
                    - completed
                    - failed
                    example: completed
                    description: Le statut de la génération du rapport.
                  download_url:
                    type: string
                    example: https://app.go-kelvin.com/rails/active_storage/blobs/redirect/xxx/report.pdf
                    description: L'URL de téléchargement du rapport PDF. Présent uniquement lorsque le statut est 'completed'.
                required:
                - status
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Forbidden
        '404':
          description: Not Found - Aucune génération de rapport n'a été demandée.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: No report generation has been requested
        '409':
          description: Conflict - La simulation n'est pas encore terminée.
          content:
            application/json:
              schema:
