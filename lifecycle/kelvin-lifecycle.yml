deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations: []
  note: >-
    No operation in either spec carries `deprecated: true`. There is no deprecation
    policy page, no Sunset/Deprecation response header on the live 401, and no notice
    period stated. A v2 integrator has no published signal telling them when the
    prefix stops answering. This is the single largest lifecycle gap on this API and
    it is entirely the provider's to close. No Deprecation pointer is emitted.
breaking_changes:
- from: v2
  to: v3
  summary: >-
    Every endpoint moved from /api/v2/ to /api/v3/. Energy-performance fields renamed
    (dpe_class -> energy_rating, plus three new mandatory fields), insulation fields
    restructured from strings to objects carrying a level and a numeric u_value,
    `subsidies` replaced by a structured `financial_support` object, each
    renovation_plan category changed from a single object to an array of items,
    several enums entirely revised against the DPE/ADEME reference, `windows` renamed
    `doors_windows`, and three fields removed (recently_renovated, has_vents,
    subsidies).
  source: info.description of the v3 specification
  detail: changelog/kelvin-changelog.yml
