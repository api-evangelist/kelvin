aid: kelvin
name: Kelvin
description: 'Kelvin (kelvin°) is a Paris-based startup, founded in 2023 and backed
  by Seedcamp, building an AI-powered commercial platform for the home energy-renovation
  industry in France. Its tools help RGE-certified artisans, renovation contractors,
  general contractors, CEE delegatees and trade platforms find and qualify renovation
  prospects, generate leads through embeddable address-based simulators, automatically
  compute energy-efficiency scenarios and government aids (MaPrimeRenov / CEE) with
  remaining customer cost, and assemble complete financing packages. The AI is trained
  by thermal engineers and architects and uses open data plus computer vision to assess
  buildings without a recent DPE. More than 4,000 artisans and sales reps use Kelvin
  to prospect, prepare appointments and quote work.'
