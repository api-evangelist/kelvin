  note: >-
    The API reference is fully public and requires no login, but access to the API is
    not. No price is published anywhere (/tarifs, /prix and /pricing all 404), there is
    no self-serve key issuance, and credentials are per-team keys prefixed
    team-api-key- that kelvin provisions. Every commercial path funnels to a demo
    request or contact form. Free public calculators exist on the marketing site but
    are not API access.
