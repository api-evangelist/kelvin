apis:
- name: kelvin API
  description: >-
    REST API for kelvin's energy-renovation engine. Create a simulation from a
    latitude/longitude (and optionally a Base Adresse Nationale key), record the
    occupant's qualification profile, run kelvin's model, then read back the dwelling's
    current energy performance (DPE energy and carbon letters, consumption, insulation
    U-values, heating and hot-water systems, with a per-field provenance map saying
    whether each value came from AI, the user or a filed DPE) and a set of costed
    renovation scenarios carrying MaPrimeRenov', CEE, eco-PTZ and local aid amounts plus
    a property-valuation KPI. Also searches published French DPE certificates, exposes
    the team's own enabled catalogue of work gestures, services and price references,
    and asynchronously generates the paperwork a renovation company needs - full study,
    CEE contribution framework, dimensioning note, sworn statement and the commercial
    quote. Authenticated with a per-team bearer key prefixed team-api-key-. Current
    version v3 (25 operations); v2 remains served and documented.
  humanURL: https://app.go-kelvin.com/api/docs
